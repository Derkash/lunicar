<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="LUNICAR - Reprise et rachat de voiture, paiement sous 24h">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="10" fill="#F59E0B"/>
  <!-- Logo -->
  <g transform="translate(90,90)">
    <path d="M8 8L8 60L36 60" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="8" cy="8" r="5" fill="#F59E0B"/>
    <text x="52" y="52" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" fill="#FFFFFF">UNI<tspan fill="#F59E0B">CAR</tspan></text>
  </g>
  <!-- Titre -->
  <text x="90" y="300" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="76" font-weight="800" fill="#FFFFFF">Vendez votre voiture</text>
  <text x="90" y="392" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="76" font-weight="800" fill="#F59E0B">simplement &amp; vite</text>
  <!-- Sous-titre -->
  <text x="92" y="460" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="34" font-weight="400" fill="#CBD5E1">Estimation gratuite en 2 min · Paiement sous 24h · Sans controle technique</text>
  <!-- Badges -->
  <g font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">
    <rect x="90" y="510" width="200" height="64" rx="32" fill="#F59E0B"/>
    <text x="190" y="552" fill="#0F172A" text-anchor="middle">Paiement 24h</text>
    <rect x="310" y="510" width="180" height="64" rx="32" fill="none" stroke="#475569" stroke-width="2"/>
    <text x="400" y="552" fill="#E2E8F0" text-anchor="middle">Sans CT</text>
    <rect x="510" y="510" width="260" height="64" rx="32" fill="none" stroke="#475569" stroke-width="2"/>
    <text x="640" y="552" fill="#E2E8F0" text-anchor="middle">Toutes marques</text>
  </g>
</svg>
