services:
  - type: web
    name: lunicar
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: EMAIL_TO
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: LUNICAR_PHONE
        sync: false
      - key: LUNICAR_WHATSAPP
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SITE_URL
        value: https://lunicar.fr
    healthCheckPath: /
    autoDeploy: true
